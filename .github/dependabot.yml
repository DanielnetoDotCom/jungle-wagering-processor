version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      mikro-orm:
        patterns: ['@mikro-orm/*']
      nestjs:
        patterns: ['@nestjs/*']
      eslint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint']
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
