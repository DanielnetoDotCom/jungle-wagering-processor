global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Docker DNS returns one A record per replica, so every instance is scraped.
scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 3000
        refresh_interval: 10s

  - job_name: consumer
    dns_sd_configs:
      - names: [consumer]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: outbox-worker
    dns_sd_configs:
      - names: [outbox-worker]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: reference-worker
    dns_sd_configs:
      - names: [reference-worker]
        type: A
        port: 9100
        refresh_interval: 10s
