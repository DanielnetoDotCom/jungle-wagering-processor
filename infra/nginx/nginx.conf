worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # Docker embedded DNS: `api` resolves to every replica; re-resolved every 5s
  # so scaled or restarted replicas are picked up without reloading nginx.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;

  log_format json escape=json
    '{"time":"$time_iso8601","service":"nginx","request_id":"$request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"upstream":"$upstream_addr","request_time":$request_time,'
    '"upstream_time":"$upstream_response_time"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  server_tokens off;
  client_max_body_size 64k;

  upstream wagering_api {
    zone wagering_api 64k;
    # Round-robin across all api replicas.
    server api:3000 resolve max_fails=3 fail_timeout=5s;
    keepalive 64;
  }

  server {
    listen 8080;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Metrics are scraped directly on the internal network, never through the edge.
    location = /metrics {
      return 404;
    }

    location / {
      proxy_pass http://wagering_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      # Only idempotent methods (GET/HEAD/...) are retried on another replica;
      # POSTs are never replayed by the proxy (clients retry with Idempotency-Key).
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      add_header X-Upstream-Addr $upstream_addr always;
    }
  }
}
